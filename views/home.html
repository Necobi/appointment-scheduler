<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

     <form id="appointment-form" action="/" method="post">

            <!-- contact info -->
             
             <fieldset>
                <legend>Appointment Scheduler</legend>
                <label for="fname"> First Name:</label>
                <input type="text" id="fname" name="fname">
                <span class="err" id="err-fname">First Name is Required</span>
                <label for="lname">Last Name:</label>
                <input type="text" id="lname" name="lname">
                <span class="err" id="err-lname">Last Name is Required</span>
                <label for="text">Meeting Date</label>
                <input type="text" id="meeting-date" name="meeting-date">
                 <label for="text">Meeting Time</label>
                <input type="text" id="meeting-time" name="meeting-time">
             </fieldset>

            
             
             <button type="submit" id="submit-button">Book Appointment</button>
        </form>
    
</body>
</html>
